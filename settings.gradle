pluginManagement {
    repositories {
        maven {
            url "${NEXUS_GRADLE_CUSTOM_PLUGINS_URL}"
            credentials {
                username "${NEXUS_USER}"
                password "${NEXUS_PASSWORD}"
            }
            allowInsecureProtocol = true
        }
        maven {
            url "${NEXUS_GRADLE_PLUGINS_URL}"
            credentials {
                username "${NEXUS_USER}"
                password "${NEXUS_PASSWORD}"
            }
            allowInsecureProtocol = true
        }
    }
}

plugins {
    id 'ru.axenix.smartax.plugin.dependency-configurator-plugin' version "${CONFIGURATOR_PLUGIN_VERSION}"
}

rootProject.name = 'dui-service'
include('service', 'contract', 'client', 'model', 'integration', 'mcp-starter')

project(':service').name = 'dui-service'
project(':contract').name = 'dui-service-contract'
project(':client').name = 'dui-service-client'
project(':model').name = 'dui-service-model'
project(':integration').name = 'dui-service-integration'

project(':mcp-starter').name = 'dui-service-mcp-starter'
